[project]
name = "biotime_connector"
authors = [
    { name = "Etihad", email = "it-manager@etihad.sa" },
]
description = "BioTime Cloud to Frappe HR Employee Checkin connector"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"
